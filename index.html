<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>企鵝小物｜購買意願投票</title>
<style>
:root{font-family:system-ui,-apple-system,"Noto Sans TC",sans-serif;color:#302b27;background:#fcf8f1}*{box-sizing:border-box}body{margin:0}.wrap{max-width:1100px;margin:auto;padding:52px 22px 70px}header{text-align:center;margin-bottom:36px}.eyebrow{font-size:12px;letter-spacing:.23em;font-weight:800;color:#aa7655}h1{font-size:clamp(29px,5vw,47px);margin:12px 0}header p{color:#81766d;line-height:1.7}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px}.card{background:white;border:1px solid #eee4d9;border-radius:22px;overflow:hidden;box-shadow:0 9px 28px #624d3210}.photo{aspect-ratio:1/1;overflow:hidden;background:#e9dfd0}.photo img{width:100%;height:100%;object-fit:cover;display:block}.body{padding:22px}.tag{font-size:12px;color:#a17b5f;letter-spacing:.08em}h2{font-size:20px;margin:8px 0 18px}.vote{border:0;width:100%;padding:15px;border-radius:13px;background:#3d352f;color:#fff;font-size:15px;font-weight:750;cursor:pointer;transition:.2s}.vote:hover:not(:disabled){background:#a46e4c;transform:translateY(-1px)}.vote:disabled{cursor:default;background:#ddd5cc;color:#746a62}.vote.selected{background:#66856b;color:white}.foot{text-align:center;margin:30px 0 0;color:#80766d;font-size:13px;line-height:1.8}.status{min-height:22px;text-align:center;margin:18px 0;color:#8a674d;font-size:14px}.result{margin-top:13px;font-size:13px;color:#85796d;text-align:center}.bar{height:8px;background:#f1e9df;border-radius:12px;overflow:hidden;margin-top:9px}.fill{height:100%;background:#b88b69;width:0;transition:width .3s}.hidden{display:none}@media(max-width:750px){.wrap{padding-top:34px}.grid{grid-template-columns:1fr;max-width:460px;margin:auto}.photo{aspect-ratio:1.2/1}}
</style>
<script src="config.js" defer></script><script src="script.js" defer></script>
</head>
<body><main class="wrap"><header><div class="eyebrow">PINGU · LITTLE THINGS</div><h1>你最想帶誰回家？🐧</h1><p>三款可愛小物，你最想買哪一款？<br>每個瀏覽器可投一票，投票後即可查看結果。</p></header><section class="grid" id="grid"></section><p class="status" id="status" role="status"></p><p class="foot">謝謝你的參與 ♡<br><span id="mode"></span></p></main></body>
</html>
